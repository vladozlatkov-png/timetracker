# Copy to config.toml. Never commit config.toml.

[server]
bind = "127.0.0.1"      # "0.0.0.0" to listen on LAN / Tailscale. A warning is shown in the UI.
port = 8420
database = "poker.db"
tick_seconds = 0.25

# Identities known at startup. Extra identities can be created at runtime from /admin.
# Roles: admin, player, observer, analyst
[[identities]]
name = "vlado"
key = "change-me-admin-key"
role = "admin"

[[identities]]
name = "human"
key = "change-me-human-key"
role = "player"

[[identities]]
name = "bot-tag"
key = "change-me-tag-key"
role = "player"

[[identities]]
name = "bot-call"
key = "change-me-call-key"
role = "player"

[[identities]]
name = "claude"
key = "change-me-claude-key"
role = "player"
