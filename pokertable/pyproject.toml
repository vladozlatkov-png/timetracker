[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pokertable"
version = "0.1.0"
description = "Independent AI poker table: authoritative NLHE dealer and rules service with a browser UI and agent harness"
requires-python = ">=3.11"
dependencies = [
    "pokerkit>=0.7,<0.8",
    "phevaluator>=0.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "anthropic>=0.40"]

[project.scripts]
pokertable = "pokertable.api.app:main"
pokertable-simulate = "pokertable.simulate:main"
pokertable-agent = "pokertable_agent.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::UserWarning:pokerkit"]
